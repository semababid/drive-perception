name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      # Into a virtualenv rather than the runner's system Python. That interpreter is
      # externally managed, so installing into it is refused outright, and the torch
      # wheel this project pulls is large enough to be worth caching between runs.
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src tests scripts

      # Only the fast tests run here. Anything marked slow needs downloaded KITTI data
      # or trained weights, neither of which belongs in CI.
      - name: Test
        run: uv run pytest -m "not slow" -q
